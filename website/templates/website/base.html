{% load static %}
<!DOCTYPE html>
<html lang="{% if site_language == 'hi' %}hi{% else %}en{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}H.H. Inter College | Quality Education{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'website/img/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'website/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'website/css/features.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include "website/header.html" %}

    {% block content %}{% endblock %}

    {% include "website/footer.html" %}
    <script src="{% static 'website/js/script.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
